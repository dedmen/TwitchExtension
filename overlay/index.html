<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Now Playing</title>
  <!-- Twitch Extension Helper: required on every extension HTML file (see AGENTS.md) -->
  <script src="https://extension-files.twitch.tv/helper/v1/twitch-ext.min.js"></script>
  <link rel="stylesheet" href="overlay.css" />
</head>
<body>
  <div id="tile" class="tile" hidden>
    <div class="art" id="art">
      <span class="placeholder" id="artPlaceholder" aria-hidden="true">
        <!-- Music-note placeholder, shown when the track has no album art -->
        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18V5l12-2v13" />
          <circle cx="6" cy="18" r="3" />
          <circle cx="18" cy="16" r="3" />
        </svg>
      </span>
      <img id="artImg" alt="" />
      <span class="paused-tag" id="pausedTag">PAUSED</span>
    </div>
    <div class="text">
      <div class="artist"><span class="artist-text" id="artist"></span><span class="time" id="time" hidden></span></div>
      <div class="title" id="title"></div>
      <div class="next-line" id="nextLine" hidden></div>
    </div>
    <!-- Skip-to-next: visible only when skipEnabled; sends {"cmd":"next"} over the track WS -->
    <button class="skip-btn" id="skipBtn" type="button" title="Skip to next" aria-label="Skip to next track" hidden>
      <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
        <path d="M6 18l8.5-6L6 6v12zM16 6h2v12h-2z" />
      </svg>
    </button>
    <!-- 2 px progress bar along the bottom edge; filled locally from the position anchor -->
    <div class="progress" id="progress" hidden><div class="fill" id="progressFill"></div></div>
  </div>

  <script src="config.js"></script>
  <script src="overlay.js"></script>
</body>
</html>
